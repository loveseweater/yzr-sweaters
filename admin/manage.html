<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZR Sweaters 内容管理后台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;background:#efe9df;color:#201d1a;line-height:1.6;padding:24px}
  .bar{max-width:1100px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .bar h1{font-family:Georgia,serif;font-size:24px}
  .bar .btns{display:flex;gap:10px}
  button{border:none;border-radius:6px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-save{background:#a97d5b;color:#fff}
  .btn-deploy{background:#201d1a;color:#fff}
  button:hover{opacity:.9}
  .card{max-width:1100px;margin:0 auto 20px;background:#fff;border:1px solid #ddd2c2;border-radius:8px;padding:18px}
  .card h2{font-family:Georgia,serif;font-size:18px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .item{background:#f7f1e7;border:1px solid #e2d6c4;border-radius:8px;padding:14px}
  .item img{width:100%;height:140px;object-fit:contain;background:#fff;border-radius:6px;margin-bottom:10px}
  .item .nm{font-weight:700;font-size:15px;margin-bottom:4px}
  .item .cat{font-size:12px;color:#8a6142;margin-bottom:6px}
  .item .ds{font-size:12.5px;color:#5c564e;margin-bottom:10px}
  .item .ops{display:flex;gap:8px}
  .item .ops button{font-size:12px;padding:6px 10px}
  .del{background:#c0392b;color:#fff}
  form label{display:block;font-size:13px;margin-bottom:4px;color:#5c564e}
  form input, form textarea, form select{width:100%;padding:8px;border:1px solid #ddd2c2;border-radius:6px;font-size:14px;margin-bottom:10px;font-family:inherit}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .status{max-width:1100px;margin:0 auto;font-size:14px;color:#8a6142}
  #msg{min-height:20px}
</style>
</head>
<body>
<div class="bar">
  <h1>YZR Sweaters 内容管理</h1>
  <div class="btns">
    <button class="btn-save" onclick="save(false)">保存（仅本地）</button>
    <button class="btn-deploy" onclick="save(true)">保存并发布上线</button>
  </div>
</div>
<div id="msg" class="status"></div>

<div class="card">
  <h2>产品分类</h2>
  <div id="catbox"></div>
</div>

<div class="card">
  <h2>添加 / 编辑产品</h2>
  <input type="hidden" id="f_id">
  <div class="edit-grid">
    <div><label>产品名称</label><input id="f_name"></div>
    <div><label>分类</label><select id="f_cat"></select></div>
  </div>
  <label>产品图片（相对路径 /images/xxx.jpg，或线上图片URL）</label><input id="f_img">
  <label>产品描述</label><textarea id="f_desc"></textarea>
  <label>标签（逗号分隔）</label><input id="f_tags">
  <button class="btn-save" onclick="addProduct()">添加 / 更新产品</button>
</div>

<div class="card">
  <h2>现有产品</h2>
  <div class="grid" id="plist"></div>
</div>

<script>
let DATA=null;
const CATS_URL='/products.json';

async function load(){
  const r=await fetch('/api/products');
  DATA=await r.json();
  render();
}
function render(){
  // category select options
  const sel=document.getElementById('f_cat');
  sel.innerHTML=DATA.categories.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');
  // category list
  document.getElementById('catbox').innerHTML=DATA.categories.map(c=>'<div style="display:inline-block;background:#a97d5b;color:#fff;border-radius:20px;padding:5px 14px;margin:0 8px 8px 0;font-size:13px">'+c.name+'</div>').join('');
  // product list
  const pl=document.getElementById('plist');
  pl.innerHTML=DATA.products.map(function(p){
    const cat=(DATA.categories.find(c=>c.id===p.category)||{}).name||p.category;
    return '<div class="item" data-id="'+p.id+'">'+
      '<img src="'+p.image+'" alt="">'+
      '<div class="nm">'+p.name+'</div>'+
      '<div class="cat">'+cat+'</div>'+
      '<div class="ds">'+p.desc+'</div>'+
      '<div class="ops"><button onclick="editProduct(\''+p.id+'\')">编辑</button><button class="del" onclick="delProduct(\''+p.id+'\')">删除</button></div>'+
      '</div>';
  }).join('');
}
function addProduct(){
  const id=document.getElementById('f_id').value || 'prod-'+Date.now();
  const p={id:id,
    name:document.getElementById('f_name').value,
    category:document.getElementById('f_cat').value,
    image:document.getElementById('f_img').value,
    desc:document.getElementById('f_desc').value,
    tags:(document.getElementById('f_tags').value||'').split(',').map(t=>t.trim()).filter(Boolean)
  };
  const ix=DATA.products.findIndex(x=>x.id===id);
  if(ix>=0) DATA.products[ix]=p; else DATA.products.push(p);
  document.getElementById('f_id').value='';document.getElementById('f_name').value='';document.getElementById('f_desc').value='';document.getElementById('f_img').value='';document.getElementById('f_tags').value='';
  render(); updateStatus('已更新产品：'+p.name);
}
function editProduct(id){
  const p=DATA.products.find(x=>x.id===id);
  if(!p)return;
  document.getElementById('f_id').value=p.id;
  document.getElementById('f_name').value=p.name;
  document.getElementById('f_cat').value=p.category;
  document.getElementById('f_img').value=p.image;
  document.getElementById('f_desc').value=p.desc;
  document.getElementById('f_tags').value=(p.tags||[]).join(', ');
  window.scrollTo({top:0,behavior:'smooth'});
}
function delProduct(id){
  if(!confirm('删除该产品？'))return;
  DATA.products=DATA.products.filter(x=>x.id!==id);
  render(); updateStatus('已删除产品');
}
function updateStatus(t){document.getElementById('msg').textContent=t;}
async function save(deploy){
  const r=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json','X-Action':deploy?'deploy':'save'},body:JSON.stringify(DATA)});
  const t=await r.text();
  updateStatus((deploy?'[发布] ':'[保存] ')+t);
  if(deploy) updateStatus('[发布] '+t+' —— Cloudflare 会自动重新发布，约1分钟生效');
}
load();
</script>
</body>
</html>
